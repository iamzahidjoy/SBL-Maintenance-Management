name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days — comfortably inside Supabase's 7-day free-tier
    # inactivity window, so the project never gets the chance to pause.
    - cron: '0 3 */3 * *'
  workflow_dispatch: # lets you also run it manually from the Actions tab, any time

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the SGWICUS Supabase database
        run: |
          curl -s -o /dev/null -w "Ping response: %{http_code}\n" \
            "https://dvnvvjkhfcyeblhaagyr.supabase.co/rest/v1/machines?select=trace&limit=1" \
